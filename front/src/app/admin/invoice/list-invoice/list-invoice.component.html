<div class="card animate__animated animate__fadeIn">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
      <h3 class="card-title mb-0">Facturas y presupuestos</h3>
      <button mat-raised-button color="primary" routerLink="/admin/invoice/new">
        <mat-icon>add</mat-icon>
        Nuevo documento
      </button>
    </div>

    <hr>

    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="invoices()">
        <ng-container matColumnDef="number">
          <th mat-header-cell *matHeaderCellDef><strong>Número</strong></th>
          <td mat-cell *matCellDef="let element">{{ element.number }}</td>
        </ng-container>

        <ng-container matColumnDef="document_type">
          <th mat-header-cell *matHeaderCellDef><strong>Tipo</strong></th>
          <td mat-cell *matCellDef="let element">
            <span class="badge" [class.bg-secondary]="isQuote(element)" [class.bg-primary]="!isQuote(element)">
              {{ documentTypeLabel(element.document_type) }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="customer_name">
          <th mat-header-cell *matHeaderCellDef><strong>Cliente</strong></th>
          <td mat-cell *matCellDef="let element">{{ element.customer_name }}</td>
        </ng-container>

        <ng-container matColumnDef="issue_date">
          <th mat-header-cell *matHeaderCellDef><strong>Emisión</strong></th>
          <td mat-cell *matCellDef="let element">{{ element.issue_date }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef><strong>Estado</strong></th>
          <td mat-cell *matCellDef="let element">
            <span class="badge" [ngClass]="statusClass(element.status)">
              {{ statusLabel(element.status) }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef class="text-end"><strong>Total</strong></th>
          <td mat-cell *matCellDef="let element" class="text-end">{{ element.total | number:'1.2-2' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-center"><strong>Acciones</strong></th>
          <td mat-cell *matCellDef="let element" class="text-center">
            @if (isQuote(element)) {
              <button mat-button color="warn" (click)="presentInvoice(element)">
                Presentar
              </button>
            }
            <button mat-button color="primary" [routerLink]="['/admin/invoice/detailinvoice', element.id]">
              Ver detalle
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
