<div class="card animate__animated animate__fadeIn">
  <div class="card-body">
    <div class="d-flex">
      <h3 class="card-title flex-grow-1">Metodos de Pagos:</h3>
      <button type="button" (click)="newPaymentMethod()" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle-fill"></i> Nuevo
      </button>
    </div>
    <hr>
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="payments()">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef><strong>Id.</strong></th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef><strong>Nombre</strong></th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="is_active">
          <th mat-header-cell *matHeaderCellDef><strong>Estado</strong></th>
          <td mat-cell *matCellDef="let element" class="text-center">
            <mat-icon [class]="element.is_active ? 'text-success' : 'text-danger'">power_settings_new</mat-icon>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-center"><strong>Acciones</strong></th>
          <td mat-cell *matCellDef="let element" class="text-center">
            <button mat-button color="primary" (click)="editPaymentMethod(element)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div class="p-3 text-muted" *ngIf="!payments().length">
        No hay métodos de pago registrados.
      </div>
    </div>
  </div>
</div>
