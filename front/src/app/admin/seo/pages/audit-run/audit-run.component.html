<div class="card animate__animated animate__fadeIn">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div>
        <h3 class="card-title mb-1">Nueva auditoría SEO</h3>
        <p class="text-muted mb-0">Lanzará un crawler en segundo plano (Celery) que analizará la URL indicada.</p>
      </div>
      <a mat-stroked-button routerLink="/admin/seo/audit-list">Volver al listado</a>
    </div>

    <hr>

    <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
      <div class="col-12 col-md-8">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Proyecto</mat-label>
          <mat-select formControlName="project">
            @for (p of projects(); track p.id) {
              <mat-option [value]="p.id">{{ p.name }} ({{ p.domain }})</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-12 col-md-4 d-flex align-items-end">
        <button mat-stroked-button type="button" (click)="createProjectPrompt()">
          <mat-icon>add</mat-icon>
          Nuevo proyecto
        </button>
      </div>

      <div class="col-12 col-md-9">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>URL objetivo</mat-label>
          <input matInput formControlName="target_url" placeholder="https://example.com">
        </mat-form-field>
      </div>
      <div class="col-12 col-md-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Máx. páginas</mat-label>
          <input matInput type="number" formControlName="max_pages" min="1" max="500">
        </mat-form-field>
      </div>

      <div class="col-12 d-flex justify-content-end">
        <button mat-raised-button color="primary" type="submit" [disabled]="saving() || form.invalid">
          <mat-icon>play_arrow</mat-icon>
          {{ saving() ? 'Lanzando…' : 'Lanzar auditoría' }}
        </button>
      </div>
    </form>
  </div>
</div>
